<!doctype html>

<head>

  <link href="assets/css/plugins/animate.min.css" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="assets/fonts/inter/inter.css" id="main-font-link">
  <link rel="stylesheet" href="assets/fonts/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/fonts/feather.css">
  <link rel="stylesheet" href="assets/fonts/fontawesome.css">
  <link rel="stylesheet" href="assets/fonts/material.css">
  <link rel="stylesheet" href="assets/css/style.css" id="main-style-link">
  <link rel="stylesheet" href="assets/css/style-preset.css">
  <link rel="stylesheet" href="assets/css/landing.css">
  <style>
    body { background: #f3f5f7; color: #101820; font-family: 'Inter', sans-serif; }
    .page-shell { max-width: 1200px; margin: 0 auto; padding: 2rem 1.25rem 3.5rem; }
    #home .navbar { margin-bottom: 0 !important; }
    #home .navbar-brand { display: none; }
    .hero { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 420px; gap: 1.5rem; align-items: stretch; }
    .hero-visual, .detail-card { overflow: hidden; background: #fff; border: 1px solid rgba(16, 24, 32, 0.08); border-radius: 1.2rem; box-shadow: 0 12px 20px rgba(16, 24, 32, 0.08); }
    .hero-visual { min-height: 0; }
    .hero-visual img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .detail-card { padding: 1.5rem; }
    .eyebrow { margin-bottom: 0.75rem; color: #f4b942; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .detail-card h1 { margin-bottom: 0.75rem; font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; line-height: 1.1; }
    .detail-card p { margin-bottom: 1.25rem; color: #4b5563; line-height: 1.8; }
    .meta-list { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.25rem; }
    .meta-list span { padding: 0.45rem 0.8rem; border: 1px solid rgba(244, 185, 66, 0.45); border-radius: 999px; background: #fdf7ea; color: #101820; font-size: 0.8rem; font-weight: 600; }
    .back-link { display: inline-block; padding: 0.8rem 1.2rem; border-radius: 999px; background: #101820; color: #fff; text-decoration: none; font-weight: 600; }
    .video-gallery-section { margin-top: 2.5rem; }
    .video-gallery-title { width: fit-content; max-width: 100%; margin: 0 auto 1.5rem; padding: 0.7rem 1.1rem; color: #fff; background: #101820; border-left: 4px solid #f4b942; border-radius: 0.35rem; box-shadow: 0 8px 18px rgba(16, 24, 32, 0.16); font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 800; line-height: 1.2; text-align: center; }
    .video-gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; }
    .video-card { overflow: hidden; background: #fff; border: 1px solid rgba(16, 24, 32, 0.08); border-radius: 1rem; box-shadow: 0 10px 18px rgba(16, 24, 32, 0.06); transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .video-card:hover { transform: translateY(-4px); box-shadow: 0 16px 28px rgba(16, 24, 32, 0.12); }
    .video-frame { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; background: #101820; }
    .video-card-heading { padding: 0.9rem 1.15rem 0.8rem; border-bottom: 3px solid #f4b942; background: #fff; }
    .video-card-title { margin: 0 0 0.4rem; color: #101820; font-size: 1.05rem; font-weight: 700; text-align: center; }
    .video-card-content { padding: 1rem 1.15rem 1.15rem; }
    .video-card-description { margin: 0; color: #4b5563; font-size: 0.9rem; line-height: 1.6; }
    .video-gallery-empty { grid-column: 1 / -1; margin: 0; padding: 2rem; color: #5b6b79; background: rgba(255, 255, 255, 0.7); border: 1px dashed rgba(16, 24, 32, 0.2); border-radius: 0.85rem; text-align: center; }
    @media (max-width: 767.98px) { #home .navbar-brand { display: inline-block; } .hero { grid-template-columns: 1fr; grid-auto-rows: auto; } .hero-visual { min-height: 420px; } .video-gallery { grid-template-columns: 1fr; } }
  </style>

<body data-pc-preset="preset-1" data-pc-sidebar-caption="true" data-pc-direction="ltr" data-pc-theme_contrast="" data-pc-theme="light" class="landing-page">
  <header id="home">
    <nav class="navbar navbar-expand-md navbar-light default mb-0">
      <div class="container">
        <a class="navbar-brand text-black ps-4 fw-semibold" href="index.html">Mario</a>
        <button class="navbar-toggler rounded" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0 align-items-center">
            <li class="nav-item px-1"><a class="nav-link" href="index.html">Home</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <script>document.addEventListener('DOMContentLoaded', function () { var navToggler = document.querySelector('.navbar-toggler'); var navbarCollapse = document.querySelector('.navbar-collapse'); navToggler.addEventListener('click', function () { navbarCollapse.classList.toggle('show'); }); });</script>
  </header>

  <div class="page-shell">
    <main>
      <section class="hero">
        <div class="hero-visual"><img src="upload/videography-projects.jfif" alt="Videography Projects showcase"></div>
        <div class="detail-card">
          <div class="eyebrow">My Service</div>
          <h1>Videography Projects</h1>
          <p>Halaman untuk menampilkan proyek videografi, dokumentasi acara, dan karya visual yang akan ditambahkan.</p>
          <div class="meta-list"><span>Event</span><span>Documentary</span><span>Brand Video</span></div>
          <a href="index.html#projects" class="back-link">Kembali</a>
        </div>
      </section>
      <section class="video-gallery-section" aria-labelledby="video-gallery-title">
        <h2 id="video-gallery-title" class="video-gallery-title">Videography Projects</h2>
        <div id="videoGallery" class="video-gallery" aria-live="polite">
          <p class="video-gallery-empty">Project videografi akan ditambahkan di sini.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="tambah-data.js"></script>
  <script>
    function getYouTubeEmbedUrl(link) {
      try {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = link.match(regExp);

        if (match && match[2].length === 11) {
          return `https://www.youtube-nocookie.com/embed/${match[2]}?rel=0`;
        }

        return link;
      } catch (error) {
        return link;
      }
    }

    function renderVideos() {
      const videoGallery = document.getElementById('videoGallery');

      if (!videoGallery || videographyData.length === 0) {
        return;
      }

      videoGallery.innerHTML = videographyData.map(video => `
        <article class="video-card">
          <div class="video-card-heading">
            <h3 class="video-card-title">${video.title}</h3>
          </div>
          <iframe class="video-frame" src="${getYouTubeEmbedUrl(video.link)}" title="${video.title}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          <div class="video-card-content">
            <p class="video-card-description">${video.description}</p>
          </div>
        </article>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', function () {
      renderVideos();
    });
  </script>
</body>

</html>
